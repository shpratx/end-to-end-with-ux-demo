  /webhooks/ecommerce:
    post:
      operationId: receiveEcommerceWebhook
      summary: Receive e-commerce event
      description: Webhook receiver for e-commerce platform purchase/refund events.
        Validates HMAC-SHA256 signature. Idempotent by order_id + event_type.
      tags:
      - Webhooks
      security:
      - apiKeyAuth: []
      parameters:
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
        description: HMAC-SHA256 signature of request body
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - eventType
              - orderId
              - customerEmail
              - totalAmount
              properties:
                eventType:
                  type: string
                  enum:
                  - order.completed
                  - order.refunded
                orderId:
                  type: string
                  example: ECOM-2026-789012
                customerEmail:
                  type: string
                  format: email
                totalAmount:
                  type: number
                  format: double
                  example: 149.99
                currency:
                  type: string
                  example: GBP
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
                      name:
                        type: string
                      category:
                        type: string
                      amount:
                        type: number
                        format: double
                timestamp:
                  type: string
                  format: date-time
      responses:
        '202':
          description: Webhook accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                    example: true
                  correlationId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
