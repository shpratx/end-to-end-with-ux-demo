openapi: 3.0.3
info:
  title: Dunelm Loyalty Program API
  description: 'Unified Loyalty Program API for Dunelm plc omnichannel retail.

    Supports customer registration, points earning/redemption, tier management,

    notifications, staff operations, and admin configuration.

    '
  version: 1.0.0
  contact:
    name: Dunelm Loyalty Engineering
    email: loyalty-engineering@Dunelm.co.uk
servers:
- url: https://loyalty.Dunelm.co.uk/api/v1
  description: Production
- url: https://staging.loyalty.Dunelm.co.uk/api/v1
  description: Staging
- url: http://localhost:3000/api/v1
  description: Local Development
security:
- bearerAuth: []
tags:
- name: Auth
  description: Customer registration and authentication
- name: Customers
  description: Customer profile and preferences management
- name: Points
  description: Points earning, redemption, and balance
- name: Tiers
  description: Loyalty tier system
- name: Notifications
  description: Customer notification management
- name: Staff
  description: Store staff operations
- name: Admin
  description: Admin portal operations
- name: Health
  description: Service health checks
paths:
  /auth/register:
    post:
      operationId: registerCustomer
      summary: Register a new customer
      description: Create a new loyalty account. Triggers OTP verification email.
        Rate limited to 5 attempts per IP per hour.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - phone
              - password
              - termsAndConditionsVersion
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Jane Smith
                email:
                  type: string
                  format: email
                  example: jane.smith@example.com
                phone:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
                  example: '+447700900123'
                password:
                  type: string
                  minLength: 12
                  example: SecureP@ss2026!
                termsAndConditionsVersion:
                  type: string
                  example: '2.1'
      responses:
        '201':
          description: Customer created, OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - pending_verification
                  message:
                    type: string
                    example: Verification code sent to your email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      summary: Verify OTP code
      description: Validate the 6-digit OTP sent during registration or email/phone
        change. Max 5 attempts before 30-minute lockout.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - otpCode
              properties:
                customerId:
                  type: string
                  format: uuid
                otpCode:
                  type: string
                  pattern: ^\d{6}$
                  example: '123456'
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  expiresIn:
                    type: integer
                    example: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/resend-otp:
    post:
      operationId: resendOtp
      summary: Resend OTP code
      description: Resend verification OTP. Rate limited to 3 requests per 10 minutes.
        60-second cooldown between resends.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              properties:
                customerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                    example: true
                  DunelmResendAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: loginCustomer
      summary: Login with email and password
      description: Authenticate with email/password. Account locked after 5 consecutive
        failures for 30 minutes.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login/social:
    post:
      operationId: socialLogin
      summary: Login with social provider
      description: Authenticate via Google or Apple OAuth2/OIDC. Creates account if
        new user.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - provider
              - idToken
              properties:
                provider:
                  type: string
                  enum:
                  - google
                  - apple
                idToken:
                  type: string
      responses:
        '200':
          description: Social login successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AuthTokenResponse'
                - type: object
                  properties:
                    isNewAccount:
                      type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token. Token rotation
        applied.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: logoutCustomer
      summary: Logout and revoke tokens
      description: Revoke the current refresh token and invalidate the session.
      tags:
      - Auth
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Logged out successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password/request:
    post:
      operationId: requestPasswordReset
      summary: Request password reset
      description: Send a password reset link to the registered email. Link expires
        in 1 hour. Response is always 200 to prevent email enumeration.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset link sent if account exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account exists with this email, a reset link has
                      been sent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Confirm password reset
      description: Set a new password using the reset token from the email link.
      tags:
      - Auth
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/me/profile:
    get:
      operationId: getMyProfile
      summary: Get current customer profile
      description: Retrieve the authenticated customer's profile including tier, lifetime
        points, and membership date.
      tags:
      - Customers
      responses:
        '200':
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateMyProfile
      summary: Update current customer profile
      description: Update profile fields. Email/phone changes require OTP re-verification.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: ^\+[1-9]\d{1,14}$
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/me:
    delete:
      operationId: deleteMyAccount
      summary: Delete customer account
      description: Soft-delete the account. PII is anonymised but ledger retained
        for audit. Irreversible.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Account deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/me/preferences:
    get:
      operationId: getMyPreferences
      summary: Get notification preferences
      description: Retrieve the customer's notification preference settings by category.
      tags:
      - Customers
      responses:
        '200':
          description: Notification preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactional:
                    type: boolean
                    description: Points earned/redeemed/adjusted (cannot fully disable)
                    example: true
                  promotional:
                    type: boolean
                    description: Campaigns, offers, early access (opt-in required)
                    example: false
                  system:
                    type: boolean
                    description: Expiration warnings, account changes, security alerts
                    example: true
                  emailCopies:
                    type: boolean
                    description: Receive email copies of notifications
                    example: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateMyPreferences
      summary: Update notification preferences
      description: Update notification preference toggles. Transactional notifications
        cannot be fully disabled.
      tags:
      - Customers
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactional:
                  type: boolean
                promotional:
                  type: boolean
                system:
                  type: boolean
                emailCopies:
                  type: boolean
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactional:
                    type: boolean
                  promotional:
                    type: boolean
                  system:
                    type: boolean
                  emailCopies:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /customers/identify:
    get:
      operationId: identifyCustomer
      summary: Identify customer at POS
      description: Look up a customer by phone, loyalty ID, or QR code for in-store
        identification. Requires API key auth (POS terminal).
      tags:
      - Customers
      security:
      - apiKeyAuth: []
      parameters:
      - name: method
        in: query
        required: true
        schema:
          type: string
          enum:
          - phone
          - loyalty_id
          - qr
      - name: value
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Customer identified
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId:
                    type: string
                    format: uuid
                  name:
                    type: string
                  tier:
                    type: string
                    example: Gold
                  pointsBalance:
                    type: integer
                    example: 2500
                  memberSince:
                    type: string
                    format: date
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /points/earn:
    post:
      operationId: earnPoints
      summary: Earn points on purchase
      description: Credit points to a customer based on a purchase transaction. Idempotent
        by transaction reference. Requires API key (POS/e-commerce system).
      tags:
      - Points
      security:
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - customerId
              - transactionAmount
              - referenceId
              - channel
              properties:
                customerId:
                  type: string
                  format: uuid
                transactionAmount:
                  type: number
                  format: double
                  minimum: 0.01
                  example: 75.5
                referenceId:
                  type: string
                  description: Order or transaction ID from source system
                  example: ORD-2026-001234
                channel:
                  type: string
                  enum:
                  - online
                  - in_store
                  - app
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku:
                        type: string
                      category:
                        type: string
                      amount:
                        type: number
                        format: double
      responses:
        '201':
          description: Points earned
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    format: uuid
                  pointsEarned:
                    type: integer
                    example: 76
                  bonusPoints:
                    type: integer
                    example: 0
                  newBalance:
                    type: integer
                    example: 1576
                  campaignApplied:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /points/redeem:
    post:
      operationId: redeemPoints
      summary: Redeem points at checkout
      description: Deduct points and apply discount to an order. Validates balance,
        minimum threshold, and max discount rules. Atomic operation with row-level
        locking.
      tags:
      - Points
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - pointsToRedeem
              - orderId
              - orderTotal
              - channel
              properties:
                pointsToRedeem:
                  type: integer
                  minimum: 1
                  example: 500
                orderId:
                  type: string
                  example: ORD-2026-005678
                orderTotal:
                  type: number
                  format: double
                  example: 120.0
                channel:
                  type: string
                  enum:
                  - online
                  - in_store
                  - app
      responses:
        '200':
          description: Points redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  transactionId:
                    type: string
                    format: uuid
                  pointsRedeemed:
                    type: integer
                    example: 500
                  discountApplied:
                    type: number
                    format: double
                    example: 25.0
                  remainingBalance:
                    type: integer
                    example: 1076
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /points/balance:
    get:
      operationId: getPointsBalance
      summary: Get points balance
      description: Retrieve the authenticated customer's current points balance with
        monetary equivalent and tier multiplier.
      tags:
      - Points
      responses:
        '200':
          description: Points balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointsBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /points/transactions:
    get:
      operationId: getPointsTransactions
      summary: Get points transaction history
      description: Paginated list of all points transactions for the authenticated
        customer. Filterable by type and date range.
      tags:
      - Points
      parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - name: type
        in: query
        schema:
          type: string
          enum:
          - earn
          - redeem
          - adjustment
          - bonus
          - expired
          - reversal
      - name: fromDate
        in: query
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tiers:
    get:
      operationId: listTiers
      summary: List all loyalty tiers
      description: Retrieve all configured loyalty tiers with thresholds, multipliers,
        and benefits.
      tags:
      - Tiers
      security: []
      responses:
        '200':
          description: Tier list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
