server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loyalty_notifications
    username: ${DB_USERNAME:loyalty}
    password: ${DB_PASSWORD:loyalty}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

notification:
  push:
    fcm-server-key: ${FCM_SERVER_KEY:}
    apns-key-id: ${APNS_KEY_ID:}
    apns-team-id: ${APNS_TEAM_ID:}
    apns-bundle-id: ${APNS_BUNDLE_ID:}

resilience4j:
  circuitbreaker:
    instances:
      fcm:
        sliding-window-size: 30
        failure-rate-threshold: 17  # 5 failures in 30 calls ≈ 17%
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
      apns:
        sliding-window-size: 30
        failure-rate-threshold: 17
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s
      email:
        sliding-window-size: 30
        failure-rate-threshold: 17
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
