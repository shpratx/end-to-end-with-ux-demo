spring:
  application:
    name: loyalty-core-service
  datasource:
    url: jdbc:postgresql://localhost:5432/loyalty
    username: loyalty_app
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

loyalty:
  redemption:
    min-threshold: 100
    max-discount-percent: 50
  webhook:
    ecommerce-secret: ${WEBHOOK_ECOMMERCE_SECRET:change-me}
  qr:
    secret: ${QR_ENCRYPTION_SECRET:0123456789abcdef}
